name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish missing packages from the existing tag for the root package.json version
        type: boolean
        default: false

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Read and validate release version
        shell: bash
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          export RELEASE_VERSION
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ ! "$RELEASE_VERSION" =~ ^$stable$ ]]; then
            echo "::error::Set a stable version (X.Y.Z) in the root package.json."
            exit 1
          fi

          latest_tag=$(git tag --sort=-version:refname | awk "/^v$stable\$/ && !found++ { print }")
          if [[ "$PUBLISH_ONLY" == 'true' ]]; then
            tag="v$RELEASE_VERSION"
            if [[ "$tag" != "$latest_tag" ]] || ! git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
              echo "::error::Publish-only requires $tag to be the latest stable tag and reachable from main."
              exit 1
            fi
            git checkout --detach "refs/tags/$tag"
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          for (const manifest of ['package.json', 'packages/react/package.json', 'packages/next/package.json']) {
            const { version } = JSON.parse(readFileSync(manifest, 'utf8'));
            if (version !== process.env.RELEASE_VERSION) {
              console.error(`::error::${manifest} has version ${version}; expected ${process.env.RELEASE_VERSION}.`);
              process.exit(1);
            }
          }
          NODE
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ -n "$latest_tag" && "$(printf '%s\n' "$latest_tag" "v$RELEASE_VERSION" | sort -Vu | tail -n 1)" == "$latest_tag" ]]; then
            echo "::error::Bump the root package.json version above $latest_tag before releasing."
            exit 1
          fi

          for package in @supertokens/rownd-react @supertokens/rownd-nextjs; do
            npm view "$package" versions --json | node -e '
              const versions = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              if (versions.includes(process.env.RELEASE_VERSION)) {
                console.error("::error::" + process.argv[1] + "@" + process.env.RELEASE_VERSION + " already exists on npm.");
                process.exit(1);
              }
            ' "$package"
          done

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- run --coverage

      - name: Release both packages
        if: ${{ !inputs.publish_only }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main has moved. Dispatch a new release from its current tip."
            exit 1
          fi

          git branch --set-upstream-to=origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release -- "$RELEASE_VERSION" --ci --npm.allowSameVersion

      - name: Publish missing packages from the release tag
        if: inputs.publish_only
        shell: bash
        run: |
          pending=()
          for directory in packages/react packages/next; do
            package=$(node -p "require('./$directory/package.json').name")
            published=$(npm view "$package" versions --json | node -p \
              'JSON.parse(require("node:fs").readFileSync(0, "utf8")).includes(process.env.RELEASE_VERSION)')
            if [[ "$published" == 'true' ]]; then
              echo "$package@$RELEASE_VERSION is already published; skipping."
            else
              pending+=("$directory")
            fi
          done

          if ((${#pending[@]} == 0)); then
            exit 0
          fi

          npm run build
          for directory in "${pending[@]}"; do
            npm publish "./$directory" --access public --loglevel verbose
          done
